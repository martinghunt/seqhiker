name: CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"

env:
  GODOT_VERSION: 4.6.3

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: zem/go.mod

      - name: Run zem tests
        working-directory: zem
        run: go test ./...

      - name: Install Godot headless
        run: |
          set -euo pipefail
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Headless Godot editor load check
        run: /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Headless Godot unit tests
        run: GODOT_BIN=/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 bash tests/godot/run_tests.sh

      - name: Headless Godot startup smoke test
        run: /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --quit-after 1
